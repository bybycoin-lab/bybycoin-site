<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYBYCOIN</title>

  <style>
    body{
      margin:0;
      padding:0;
      background:black;
      color:white;
      font-family:Arial;
      overflow:hidden;
    }

    .container{
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    h1{
      font-size:60px;
      color:#ff0055;
      text-shadow:0 0 20px #ff0055;
      animation: glow 2s infinite alternate;
    }

    p{
      font-size:20px;
      opacity:0.8;
    }

    button{
      margin-top:30px;
      padding:15px 40px;
      border:none;
      border-radius:12px;
      background:#ff0055;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.1);
      background:#ff3377;
    }

    @keyframes glow{
      from{
        text-shadow:0 0 10px #ff0055;
      }
      to{
        text-shadow:0 0 30px #ff0055;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🚀 BYBYCOIN</h1>
  <p>The Future of Web3 is Here</p>

  <button onclick="connectWallet()">
    Connect Wallet
  </button>
</div>

<script>
async function connectWallet() {

  if(window.ethereum){
    try{
      await window.ethereum.request({
        method:'eth_requestAccounts'
      });

      alert("Wallet Connected 🚀");
    }
    catch(error){
      alert("Connection Cancelled");
    }
  }
  else{
    alert("Please install MetaMask");
  }
}
</script>
<script>
async function connectWallet() {

  if (window.ethereum) {

    try {

      const accounts = await window.ethereum.request({
        method: 'eth_requestAccounts'
      });

      const wallet = accounts[0];

      document.querySelector("button").innerText =
        wallet.slice(0,6) + "..." + wallet.slice(-4);

      alert("Wallet Connected 🚀");

    } catch(error) {

      alert("Connection Cancelled");

    }

  } else {

    alert("Please install MetaMask");

  }

}
</script>
</body>
</html>
